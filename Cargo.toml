[package]
name = "cookie"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Run Android apps on Linux like they belong there"
license = "GPL-3.0-or-later"
repository = "https://github.com/clrealy/cookie"
readme = "README.md"
keywords = ["android", "apk", "waydroid", "linux", "desktop"]
categories = ["command-line-utilities"]

[[bin]]
name = "cookie"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"
dirs = "6"
libc = "0.2.191"

[profile.release]
strip = true
lto = "thin"
panic = "abort"
